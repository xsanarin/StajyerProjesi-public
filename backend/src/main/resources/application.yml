server:
  port: 8070

spring:
  # Sirlar (DB_PASSWORD, APP_JWT_SECRET, ADMIN_SIFRE) repoda degil: env'den ya da
  # git'e girmeyen ./application-local.yml'den gelir (ornek: application-local.yml.example).
  config:
    import: optional:file:./application-local.yml

  # messages.properties Turkce karakter iceriyor ve dosya UTF-8. Spring Boot'un
  # varsayilani da UTF-8 ama acikca yaziyoruz: platform varsayilani ISO-8859-1'e
  # dusen bir ortamda mesajlar "Ã¼" gibi bozuk cikardi.
  messages:
    basename: messages
    encoding: UTF-8

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # ADIM 2 - Sema yonetimi Flyway'e devredildi.
  flyway:
    enabled: true
    # Mevcut gelistirme veritabanlarinda V1 (baseline) calistirilmaz, sadece
    # isaretlenir; sifirdan kurulan veritabanlarinda V1 semayi bastan yaratir.
    baseline-on-migrate: true
    baseline-version: 1
    # A'nin V2-V4'u ile B'nin V10-V12'si farkli siralarda merge olabilir;
    # dev'de bunun migration'i kirmamasi icin (KISI-B.md ADIM 0).
    out-of-order: true

  jpa:
    hibernate:
      # KRITIK: 'update' birakilirsa Hibernate Flyway'in arkasindan semaya
      # mudahale etmeye devam eder ve drift geri gelir. 'validate' sadece
      # entity <-> tablo uyumunu dogrular, hicbir sey degistirmez.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# ADIM 2 - JWT ayarlari
app:
  jwt:
    # HS256 icin en az 32 byte'lik gizli anahtar. Varsayilan YOK: verilmezse uygulama acilmaz.
    secret: ${APP_JWT_SECRET}
    # Token gecerlilik suresi (ms): 30 dk
    expiration-ms: 1800000
  # ADIM 3 - Bitis bildirimi
  bildirim:
    # Bitisine kac gun kalanlar bildirilsin.
    gun: 5
    # Gunluk 08:00 job'i (MON-FRI, Europe/Istanbul). false ise job hic yuklenmez.
    zamanlanmis: true
    mail:
      # VARSAYILAN KAPALI: SMTP ayarlanmadan mail gondermeye calismak anlamsiz.
      # Kapaliyken gonderilecek icerik log'a yazilir (job yine de calisir).
      # Acmak icin: spring.mail.* ayarlarini doldur + burayi true yap.
      gonder: false
      kimden: staj-envanter@localhost
  admin:
    # Ilk acilista olusturulan admin (CommandLineRunner seed).
    email: ${ADMIN_EMAIL:admin@staj.local}
    sifre: ${ADMIN_SIFRE}